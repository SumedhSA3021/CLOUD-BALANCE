# CloudBalance Nginx Reverse Proxy — Primary GCP Controller VM Config (systemd + Nginx)
# Install on Controller VM as /etc/nginx/sites-available/cloudbalance and symlink to sites-enabled/.
# Secondary Docker Compose container config lives at infra/nginx/nginx.conf (upstream controller:8000).
#
# SECURITY NOTE: Plain HTTP (:80) transmits Authorization: Bearer <ADMIN_TOKEN> and
# ?token=... WebSocket query parameters unencrypted over the network. Before exposing to
# untrusted networks, terminate TLS (HTTPS / Cloudflare Tunnel) AND/OR uncomment the
# ALLOWED_ADMIN_CIDR allowlist blocks below on /ops, /benchmark, /admin/, /api/v1/control,
# /api/v1/telemetry, and /api/v1/benchmark. Public routes (/, /client, /tasks, /test/status,
# /healthz) stay open so demo clients can submit tasks cleanly.

upstream cloudbalance_controller {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;

    root /opt/cloudbalance/frontend/dist;
    index index.html;

    # Match FastAPI MAX_PAYLOAD_BYTES (65536 bytes)
    client_max_body_size 64k;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Public Backend Endpoints (stay open) ---
    location /tasks {
        proxy_pass http://cloudbalance_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /test/ {
        proxy_pass http://cloudbalance_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://cloudbalance_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://cloudbalance_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ready {
        proxy_pass http://cloudbalance_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Admin, Control, Telemetry & Benchmark API Routes ---
    location /admin/ {
        # Optional IP allowlist for admin API endpoints (uncomment & replace placeholder):
        # allow <ALLOWED_ADMIN_CIDR>;
        # deny all;
        proxy_pass http://cloudbalance_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/v1/control {
        # Optional IP allowlist for scheduler/control APIs:
        # allow <ALLOWED_ADMIN_CIDR>;
        # deny all;
        proxy_pass http://cloudbalance_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Note: internal GCP workers send heartbeats directly to controller internal :8000 (not via :80 Nginx).
    location /api/v1/telemetry {
        # Optional IP allowlist for telemetry inspection endpoints:
        # allow <ALLOWED_ADMIN_CIDR>;
        # deny all;
        proxy_pass http://cloudbalance_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/v1/benchmark {
        # Optional IP allowlist for benchmark endpoints:
        # allow <ALLOWED_ADMIN_CIDR>;
        # deny all;
        proxy_pass http://cloudbalance_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/v1/ws {
        proxy_pass http://cloudbalance_controller;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # General /api/ fallback (/api/v1/tasks, /api/v1/health, /api/v1/ready, /api/v1/mongo)
    location /api/ {
        proxy_pass http://cloudbalance_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # OpenAPI docs endpoints (keep optional allowlist if restricting docs in production)
    location /docs {
        proxy_pass http://cloudbalance_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://cloudbalance_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /redoc {
        proxy_pass http://cloudbalance_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Reverse Proxy for live CLUSTER_SNAPSHOT stream
    location /ws {
        proxy_pass http://cloudbalance_controller;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- React SPA Routes (try_files only; backend routes above are never swallowed) ---
    location = /client {
        try_files /index.html =404;
    }

    location = /ops {
        # Optional IP allowlist for Admin Ops Center UI:
        # allow <ALLOWED_ADMIN_CIDR>;
        # deny all;
        try_files /index.html =404;
    }

    location = /benchmark {
        # Optional IP allowlist for Benchmark Lab UI:
        # allow <ALLOWED_ADMIN_CIDR>;
        # deny all;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
