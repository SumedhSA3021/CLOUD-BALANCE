[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudbalance-backend"
version = "1.0.0"
description = "CloudBalance Adaptive Multi-Resource Cloud Load Balancer Controller"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.4",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "redis==8.1.0",
    "motor==3.7.1",
    "httpx==0.28.1",
    "ortools==9.15.6755",
    "numpy==2.2.6; python_version < \"3.12\"",
    "numpy==2.5.3; python_version >= \"3.12\"",
    "structlog==26.1.0",
    "tenacity==9.2.1",
    "psutil==7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
    "mypy==2.4.1",
]
bench = [
    "matplotlib==3.11.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["B008", "SIM105", "SIM108"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
